name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/utc-milter

  apk:
    name: Alpine APK
    runs-on: ubuntu-latest
    needs: go
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build APK
        env:
          ABUILD_PRIVATE_KEY: ${{ secrets.ABUILD_PRIVATE_KEY }}
        run: |
          if [ -z "${ABUILD_PRIVATE_KEY}" ]; then
            echo "ABUILD_PRIVATE_KEY GitHub Actions secret is required" >&2
            exit 1
          fi

          set -eux
          docker run --rm \
            -e GITHUB_REF_NAME="${GITHUB_REF_NAME}" \
            -e ABUILD_PRIVATE_KEY="${ABUILD_PRIVATE_KEY}" \
            -v "$PWD":/work \
            -w /work \
            alpine:edge \
            sh -euxc '
              apk add --no-cache alpine-sdk go git sudo tar gzip
              git config --global --add safe.directory /work

              adduser -D builder
              addgroup builder abuild
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              chown -R builder:builder /work

              install -d -m 0775 -o builder -g abuild /var/cache/distfiles
              install -d -m 0755 -o builder -g builder /home/builder/.abuild
              printf "%s\n" "${ABUILD_PRIVATE_KEY}" > /home/builder/.abuild/utc-milter.rsa
              install -m 0644 utc-milter.rsa.pub /home/builder/.abuild/utc-milter.rsa.pub
              chown builder:builder /home/builder/.abuild/utc-milter.rsa /home/builder/.abuild/utc-milter.rsa.pub
              chmod 0600 /home/builder/.abuild/utc-milter.rsa
              printf "PACKAGER_PRIVKEY=/home/builder/.abuild/utc-milter.rsa\nREPODEST=/home/builder/packages\n" > /home/builder/.abuild/abuild.conf
              chown builder:builder /home/builder/.abuild/abuild.conf
              chmod 0600 /home/builder/.abuild/abuild.conf
              cp /home/builder/.abuild/utc-milter.rsa.pub /etc/apk/keys/

              if echo "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
                sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" packaging/alpine/APKBUILD
              fi

              pkgver="$(sed -n "s/^pkgver=//p" packaging/alpine/APKBUILD)"
              pkgname="$(sed -n "s/^pkgname=//p" packaging/alpine/APKBUILD)"
              tarball="/var/cache/distfiles/${pkgname}-${pkgver}.tar.gz"
              tmpdir="$(mktemp -d)"
              mkdir -p "${tmpdir}/${pkgname}-${pkgver}"

              git ls-files -z > "${tmpdir}/files"
              tar --null -T "${tmpdir}/files" -cf - | tar -C "${tmpdir}/${pkgname}-${pkgver}" -xf -
              tar -C "${tmpdir}" -czf "${tarball}" "${pkgname}-${pkgver}"
              tar -tzf "${tarball}" | grep -qx "${pkgname}-${pkgver}/cmd/utc-milter/main.go"
              install -m 0644 packaging/alpine/utc-milter.initd /var/cache/distfiles/utc-milter.initd
              install -m 0644 packaging/alpine/utc-milter.confd /var/cache/distfiles/utc-milter.confd
              chown -R builder:builder /var/cache/distfiles

              cd packaging/alpine
              sudo -u builder abuild checksum
              sudo -u builder abuild -r

              arch="$(apk --print-arch)"
              mkdir -p /work/dist/apks /work/dist/repo/noarch "/work/dist/repo/${arch}"
              find /home/builder/packages -name "*.apk" -exec cp -v {} /work/dist/apks/ \;
              for apk in /work/dist/apks/*.apk; do
                pkg_arch="$(tar -zxOf "$apk" .PKGINFO | sed -n "s/^arch = //p")"
                if [ "${pkg_arch}" = "noarch" ]; then
                  cp -v "$apk" /work/dist/repo/noarch/
                else
                  cp -v "$apk" "/work/dist/repo/${pkg_arch}/"
                fi
              done
              cp -v /home/builder/.abuild/utc-milter.rsa.pub /work/dist/repo/utc-milter.rsa.pub
              chown -R builder:builder /work/dist

              sudo -u builder sh -euxc "
                cd /work/dist/repo/noarch
                apk index -o APKINDEX.tar.gz *.apk
                abuild-sign APKINDEX.tar.gz
              "

              sudo -u builder sh -euxc "
                cd /work/dist/repo/${arch}
                apk index -o APKINDEX.tar.gz *.apk /work/dist/repo/noarch/*.apk
                abuild-sign APKINDEX.tar.gz
              "
            '

      - name: Upload Alpine artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpine-artifacts
          path: dist
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Validate semver tag
        id: semver
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK artifacts
        if: steps.semver.outputs.valid == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: alpine-artifacts
          path: dist

      - name: Create or update GitHub release
        if: steps.semver.outputs.valid == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/apks/*.apk
          fail_on_unmatched_files: true

  pages:
    name: Alpine Repository
    runs-on: ubuntu-latest
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate semver tag
        id: semver
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Alpine repository
        if: steps.semver.outputs.valid == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: alpine-artifacts
          path: dist

      - name: Configure Pages
        if: steps.semver.outputs.valid == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: steps.semver.outputs.valid == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/repo

      - name: Deploy Alpine repository
        if: steps.semver.outputs.valid == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
